name: storm-studio

x-runtime: &runtime
  image: ${STUDIO_IMAGE:-storm-studio:0.1.0b1-server2}
  user: "10001:10001"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=192m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Build downloads use the host route; runtime services stay on an isolated bridge.
      network: host
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
        PYTHON_INDEX: ${PYTHON_INDEX:-https://mirrors.aliyun.com/pypi/simple}
    env_file:
      - ${STUDIO_ENV_FILE:-/opt/storm-studio/config/runtime.env}
    environment:
      STUDIO_DATA_DIR: /var/lib/storm-studio
    volumes:
      - ${STUDIO_DATA_PATH:-/opt/storm-studio/data}:/var/lib/storm-studio
    # Single-user Beta: private access through SSH only. Never bind to 0.0.0.0.
    ports:
      - "127.0.0.1:18765:8765"
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/session', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  worker:
    <<: *runtime
    command: ["python", "-m", "studio.worker"]
    env_file:
      - ${STUDIO_ENV_FILE:-/opt/storm-studio/config/runtime.env}
    environment:
      STUDIO_DATA_DIR: /var/lib/storm-studio
    volumes:
      - ${STUDIO_DATA_PATH:-/opt/storm-studio/data}:/var/lib/storm-studio
    mem_limit: 1536m
    cpus: 1.0
    stop_grace_period: 5m
    depends_on:
      web:
        condition: service_healthy

  backup:
    <<: *runtime
    profiles: ["ops"]
    restart: "no"
    command: ["python", "scripts/backup.py", "--output", "/backups"]
    env_file:
      - ${STUDIO_ENV_FILE:-/opt/storm-studio/config/runtime.env}
    environment:
      STUDIO_DATA_DIR: /var/lib/storm-studio
    volumes:
      - ${STUDIO_DATA_PATH:-/opt/storm-studio/data}:/var/lib/storm-studio:ro
      - ${STUDIO_BACKUP_PATH:-/opt/storm-studio/backups}:/backups
    mem_limit: 192m
    cpus: 0.25
