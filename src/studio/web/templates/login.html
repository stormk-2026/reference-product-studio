<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · Storm Studio.</title><link rel="stylesheet" href="/static/auth.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="/">Storm Studio.</a><p class="auth-kicker">让素材变成可以使用的作品</p><h1 id="auth-title">欢迎回来</h1><p id="auth-description">登录后继续你的商品视觉创作。</p>
<form id="auth-form"><label>用户名<input id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" minlength="3" maxlength="32" required placeholder="3–32 位字母、数字或下划线"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少 10 个字符"></label><p id="auth-error" role="alert"></p><button id="auth-submit" type="submit">登录</button></form>
<button id="auth-toggle" type="button" class="auth-switch">还没有账号？免费注册</button><p class="auth-note">新账号可生成 3 张图片。每张计 1 次，批量逐张计算；文案与下载不扣图片额度。明确失败返还，结果未知暂占额度。普通账号每日最多 20 个任务。主账户不限次数。</p><p class="auth-note">暂不支持自助找回密码，请妥善保存。需要重置时联系站点管理员。</p></main><footer><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026082439号-1</a></footer><script src="/static/login.js" defer></script></body></html>
